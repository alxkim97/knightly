<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*;" />
<title>Knightly · Mini Board</title>
<style>
  html, body { background: var(--bg); overflow: hidden; min-height: 0; height: 100%; }
  /* Electron snaps the window back to square after a resize drag, but the OS
     reports non-square sizes mid-drag. min(100vw, 100vh) keeps the board
     square on every paint, letterboxing briefly instead of warping. */
  #mini-square { position: absolute; top: 50%; left: 50%; width: min(100vw, 100vh); height: min(100vw, 100vh); transform: translate(-50%, -50%); }
  /* Outer 8px has no app-region so Windows' native resize edge isn't fought;
     inset from that, #mini-wrap is the drag handle and the board is no-drag. */
  #mini-wrap { position: absolute; inset: 8px; padding: 8px; -webkit-app-region: drag; }
  #mini-wrap .board-wrap { -webkit-app-region: no-drag; height: 100%; }
  #mini-toolbar { -webkit-app-region: no-drag; position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; z-index: 10; }
  #mini-pin, #mini-close { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; cursor: pointer; opacity: 0; transition: opacity .15s, background .15s; border: 0; padding: 0; }
  body:hover #mini-pin, body:hover #mini-close { opacity: .85; }
  #mini-close:hover { opacity: 1 !important; background: var(--bad); }
  #mini-pin:hover { opacity: 1 !important; }
  #mini-pin.pinned { opacity: .85; background: #16a34a; }
  #mini-pin svg, #mini-close svg { width: 12px; height: 12px; }
</style>
</head>
<body>
  <div id="mini-square"><div id="mini-wrap"><div class="board-wrap"></div></div></div>
  <div id="mini-toolbar">
    <button type="button" id="mini-pin" title="Keep on top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/></svg></button>
    <button type="button" id="mini-close" title="Close mini board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <script type="module" src="./src/mini.js"></script>
</body>
</html>
